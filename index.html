<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Codes-Hub — a sleek, advanced platform designed for fast and effortless code sharing.">
    <meta property="og:title" content="Codes-Hub: Advanced Code Sharing Platform Created by Abhin">
    <meta property="og:description" content="Codes-Hub — a sleek, advanced platform designed for fast and effortless code sharing.">

    <title> Code Hub By Abhin</title>
    <style>
        ::-webkit-scrollbar{
            width: 0;
            height: 0;
        }
        body,html{
            height: 100%;
            width: 100%;
            padding: 0;
            margin: 0;
            background-color: black;
        }
        body{
            display: flex;
            flex-direction: column;
        }
        #StatusBar{
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 10px;
            font: 600 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #e6edf3;
            background: #0d1117;
            border-bottom: 2px solid #388bfd;
            text-align: center;
            flex-wrap: wrap;
            transition: border-color .3s;
        }
        #StatusBar.warn{ border-bottom-color: #d29922; }
        #StatusBar.down{ border-bottom-color: #f85149; }
        #StatusBar.up{ border-bottom-color: #3fb950; }
        #StatusTime{
            font-variant-numeric: tabular-nums;
            background: #161b22;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: .5px;
        }
        #StatusBar.warn #StatusTime{ color: #e3b341; }
        #StatusBar.down #StatusTime{ color: #ff7b72; }
        #FrameOut{
            flex: 1 1 auto;
            min-height: 0;
            border: none;
            width: 100%;
            background-color: black;
        }
        </style>
</head>
<body>
    <div id="StatusBar">
        <span id="StatusText"></span>
        <span id="StatusTime"></span>
    </div>
    <iframe id="FrameOut" allow="web-share" src="https://floralwhite-narwhal-815795.hostingersite.com/PHPs/"></iframe>
    <script>
        const TheUrl=`https://floralwhite-narwhal-815795.hostingersite.com/PHPs/`
        const url = new URL(window.location.href);
        const folder = url.searchParams.get("OpenFolder");
        
        if(folder){
            document.getElementById("FrameOut").src=`${TheUrl}?OpenFolder=${folder}`
        }else{
            document.getElementById("FrameOut").src=`${TheUrl}`
        }

        // ===== Maintenance schedule (edit these two lines) =====
        // Format: YYYY-MM-DDTHH:MM:SS+05:30  (IST)
        const MAINTENANCE_START = new Date("2026-11-02T14:45:00+05:30");
        const MAINTENANCE_END   = new Date("2026-12-01T04:00:00+05:30");
        // How long to keep the "back online" message visible (ms). 0 = forever.
        const ONLINE_MESSAGE_DURATION = 10 * 60 * 1000;
        // =======================================================

        const bar  = document.getElementById("StatusBar");
        const text = document.getElementById("StatusText");
        const time = document.getElementById("StatusTime");

        // Calendar-aware countdown: shows years / months / days only when needed
        function fmt(targetMs){
            const now = new Date();
            const target = new Date(targetMs);
            if(target <= now) return "00:00:00";

            let c = new Date(now), y = 0, mo = 0;
            for(;;){
                const n = new Date(c); n.setFullYear(n.getFullYear() + 1);
                if(n <= target){ c = n; y++; } else break;
            }
            for(;;){
                const n = new Date(c); n.setMonth(n.getMonth() + 1);
                if(n <= target){ c = n; mo++; } else break;
            }
            const s = Math.floor((target - c) / 1000);
            const d = Math.floor(s / 86400);
            const h = String(Math.floor((s % 86400) / 3600)).padStart(2, "0");
            const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
            const sec = String(s % 60).padStart(2, "0");

            let out = "";
            if(y > 0) out += y + "y ";
            if(y > 0 || mo > 0) out += mo + "mo ";
            if(y > 0 || mo > 0 || d > 0) out += d + "d ";
            return out + `${h}:${m}:${sec}`;
        }

        function tick(){
            const now = Date.now();
            const start = MAINTENANCE_START.getTime();
            const end = MAINTENANCE_END.getTime();

            if(now < start){
                const left = start - now;
                bar.className = left < 3600000 ? "warn" : "";
                text.textContent = "🛠️ Server goes down for maintenance in";
                time.textContent = fmt(start);
                bar.style.display = "";
            } else if(now < end){
                bar.className = "down";
                text.textContent = "🔧 Under maintenance — server back online in";
                time.textContent = fmt(end);
                bar.style.display = "";
            } else if(ONLINE_MESSAGE_DURATION === 0 || now < end + ONLINE_MESSAGE_DURATION){
                bar.className = "up";
                text.textContent = "✅ Server is back online";
                time.textContent = "";
                time.style.display = "none";
                bar.style.display = "";
            } else {
                bar.style.display = "none";
                clearInterval(timer);
            }
        }

        tick();
        const timer = setInterval(tick, 1000);
    </script>
</body>
</html>
