<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Codes-Hub — a sleek, advanced platform designed for fast and effortless code sharing.">
    <meta property="og:title" content="Codes-Hub: Advanced Code Sharing Platform Created by Abhin">
    <meta property="og:description" content="Codes-Hub — a sleek, advanced platform designed for fast and effortless code sharing.">

    <title> Code Hub By Abhin</title>
    <style>
        ::-webkit-scrollbar{
            width: 0;
            height: 0;
        }
        body,html{
            height: 100%;
            width: 100%;
            padding: 0;
            margin: 0;
            background-color: black;
        }
        body{
            display: flex;
            flex-direction: column;
        }

        /* ---------- Status bar ---------- */
        #StatusBar{
            --accent: #388bfd;
            --accent-soft: rgba(56,139,253,.14);
            position: relative;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px 18px;
            flex-wrap: wrap;
            padding: 8px 16px 10px;
            font: 500 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #c9d1d9;
            background: linear-gradient(180deg, #11161d 0%, #0a0d12 100%);
            border-bottom: 1px solid #21262d;
            box-shadow: 0 4px 18px rgba(0,0,0,.55);
            z-index: 5;
        }
        #StatusBar.warn{ --accent:#d29922; --accent-soft:rgba(210,153,34,.14); }
        #StatusBar.down{ --accent:#f85149; --accent-soft:rgba(248,81,73,.14); }
        #StatusBar.up{   --accent:#3fb950; --accent-soft:rgba(63,185,80,.14); }

        /* status pill */
        #StatusPill{
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            color: #f0f6fc;
            font-weight: 600;
            white-space: nowrap;
        }
        #StatusDot{
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 0 var(--accent);
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse{
            0%   { box-shadow: 0 0 0 0 var(--accent); }
            70%  { box-shadow: 0 0 0 8px rgba(0,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
        }

        /* countdown segments */
        #Countdown{
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 6px;
        }
        .seg{
            min-width: 46px;
            padding: 4px 6px 3px;
            text-align: center;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
        }
        .seg b{
            display: block;
            font: 700 18px/1.1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-soft);
        }
        .seg i{
            display: block;
            margin-top: 2px;
            font: 600 9px/1 system-ui, sans-serif;
            font-style: normal;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #6e7681;
        }

        /* credit */
        #Credit{
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1.25;
            font-size: 11px;
            color: #8b949e;
            text-align: right;
        }
        #Credit strong{
            color: #e6edf3;
            font-size: 12.5px;
            font-weight: 650;
        }
        #Credit span{ letter-spacing: .4px; }

        /* progress line along the bottom edge */
        #Progress{
            position: absolute;
            left: 0; bottom: 0;
            height: 2px;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            transition: width 1s linear;
        }

        @media (max-width: 720px){
            #StatusBar{ justify-content: center; padding: 8px 10px 10px; }
            #Credit{ align-items: center; text-align: center; }
            .seg{ min-width: 40px; }
            .seg b{ font-size: 16px; }
        }

        #FrameOut{
            flex: 1 1 auto;
            min-height: 0;
            border: none;
            width: 100%;
            background-color: black;
        }
    </style>
</head>
<body>
    <div id="StatusBar">
        <div id="StatusPill"><span id="StatusDot"></span><span id="StatusText"></span></div>
        <div id="Countdown"></div>
        <div id="Credit">
            <span>Informed by</span>
            <strong>Abhin M · Owner</strong>
        </div>
        <div id="Progress"></div>
    </div>
    <iframe id="FrameOut" allow="web-share" src="https://mrabhin-software-build.shop/Codes-Hub/PHPs/"></iframe>
    <script>
        const TheUrl=`https://mrabhin-software-build.shop/Codes-Hub/PHPs/`
        const url = new URL(window.location.href);
        const folder = url.searchParams.get("OpenFolder");
        
        if(folder){
            document.getElementById("FrameOut").src=`${TheUrl}?OpenFolder=${folder}`
        }else{
            document.getElementById("FrameOut").src=`${TheUrl}`
        }

        // ===== Maintenance schedule (edit these two lines) =====
        // Format: YYYY-MM-DDTHH:MM:SS+05:30  (IST)
        const MAINTENANCE_START = new Date("2026-11-07T16:00:00+05:30");
        const MAINTENANCE_END   = new Date("2026-12-07T18:00:00+05:30");
        // How long to keep the "back online" message visible (ms). 0 = forever.
        const ONLINE_MESSAGE_DURATION = 10 * 60 * 1000;
        // =======================================================

        const bar       = document.getElementById("StatusBar");
        const text      = document.getElementById("StatusText");
        const countdown = document.getElementById("Countdown");
        const progress  = document.getElementById("Progress");

        const pad = n => String(n).padStart(2, "0");

        // Calendar-aware breakdown of the time left until target
        function parts(target){
            const now = new Date();
            if(target <= now) return {y:0, mo:0, d:0, h:0, m:0, s:0};

            let c = new Date(now), y = 0, mo = 0;
            for(;;){
                const n = new Date(c); n.setFullYear(n.getFullYear() + 1);
                if(n <= target){ c = n; y++; } else break;
            }
            for(;;){
                const n = new Date(c); n.setMonth(n.getMonth() + 1);
                if(n <= target){ c = n; mo++; } else break;
            }
            const s = Math.floor((target - c) / 1000);
            return {
                y, mo,
                d: Math.floor(s / 86400),
                h: Math.floor((s % 86400) / 3600),
                m: Math.floor((s % 3600) / 60),
                s: s % 60
            };
        }

        // Only shows the big units (years / months / days) when needed
        function renderCountdown(target){
            const p = parts(target);
            const segs = [];
            if(p.y > 0)                         segs.push([p.y,  "Years"]);
            if(p.y > 0 || p.mo > 0)             segs.push([p.mo, "Months"]);
            if(p.y > 0 || p.mo > 0 || p.d > 0)  segs.push([p.d,  "Days"]);
            segs.push([pad(p.h), "Hours"], [pad(p.m), "Mins"], [pad(p.s), "Secs"]);
            countdown.innerHTML = segs
                .map(([v, l]) => `<div class="seg"><b>${v}</b><i>${l}</i></div>`)
                .join("");
        }

        function tick(){
            const now = Date.now();
            const start = MAINTENANCE_START.getTime();
            const end = MAINTENANCE_END.getTime();

            bar.style.display = "";
            countdown.style.display = "";

            if(now < start){
                bar.className = (start - now) < 3600000 ? "warn" : "";
                text.textContent = "Server goes down for maintenance in";
                renderCountdown(MAINTENANCE_START);
                progress.style.width = "0%";
            } else if(now < end){
                bar.className = "down";
                text.textContent = "Under maintenance · back online in";
                renderCountdown(MAINTENANCE_END);
                progress.style.width = (((now - start) / (end - start)) * 100).toFixed(2) + "%";
            } else if(ONLINE_MESSAGE_DURATION === 0 || now < end + ONLINE_MESSAGE_DURATION){
                bar.className = "up";
                text.textContent = "Server is back online";
                countdown.style.display = "none";
                progress.style.width = "100%";
            } else {
                bar.style.display = "none";
                clearInterval(timer);
            }
        }

        tick();
        const timer = setInterval(tick, 1000);
    </script>
</body>
</html>
